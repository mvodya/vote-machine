services:
  postgres:
    ports:
      - '127.0.0.1:${WORKSPACE_DB_PORT:-5432}:5432'

  workspace:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: sleep infinity
    init: true
    ports:
      - '127.0.0.1:${WORKSPACE_WEB_PORT:-3001}:3000'
      - '127.0.0.1:${WORKSPACE_API_PORT:-8081}:8080'
    volumes:
      - .:/workspace
      - api_build:/workspace/build/api
      - api_sanitize_build:/workspace/build/api-sanitize
      - workspace_modules:/workspace/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - db_modules:/workspace/db/node_modules
      - web_next:/workspace/apps/web/.next
    environment:
      DATABASE_URL: postgresql://vote_machine:${POSTGRES_PASSWORD:-vote_machine_local}@postgres:5432/vote_machine
      ADMIN_LINK_KEY: ${ADMIN_LINK_KEY:?Set ADMIN_LINK_KEY in .env}
      API_ORIGIN: http://127.0.0.1:8080
      MEDIA_WORKER_KEY: ${MEDIA_WORKER_KEY:?Run node scripts/setup-local-env.mjs}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET:-votebox-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run node scripts/setup-local-env.mjs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run node scripts/setup-local-env.mjs}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
        required: false

  asset-cleanup:
    environment:
      API_ORIGIN: http://workspace:8080
    depends_on: !override
      workspace:
        condition: service_started
      garage:
        condition: service_healthy
        required: false

volumes:
  api_build:
  api_sanitize_build:
  workspace_modules:
  web_modules:
  db_modules:
  web_next:
