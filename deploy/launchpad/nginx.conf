# Only the named proxy may supply a client address
map $remote_addr $client_address {
  default $remote_addr;
  10.0.0.61 $http_x_real_ip;
}
log_format safe_json escape=json '{"service":"edge","status":$status,"method":"$request_method","seconds":$request_time}';
access_log /dev/stdout safe_json;
error_log /dev/stderr crit;
server_tokens off;
resolver 127.0.0.11 valid=2s ipv6=off;
upstream web_replicas {
  zone web_replicas 64k;
  server web:3000 resolve max_fails=1 fail_timeout=3s;
  keepalive 16;
}
upstream api_replicas {
  zone api_replicas 64k;
  server api:8080 resolve max_fails=1 fail_timeout=3s;
  keepalive 16;
}
server {
  listen 80;
  server_name _;
  client_max_body_size 11m;
  location = /edge/live { access_log off; return 200 'alive'; }
  location / {
    allow 10.0.0.61;
    deny all;
    proxy_pass http://web_replicas;
    proxy_http_version 1.1;
    proxy_set_header Host vote.frogling.com;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-For $client_address;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 200s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
  }
}
# Only application containers use the API listener
server {
  listen 8080;
  server_name _;
  client_max_body_size 4m;
  location / {
    proxy_pass http://api_replicas;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 200s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
  }
}
