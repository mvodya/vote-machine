name: vote-machine

x-storage-environment: &storage-environment
  S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
  S3_REGION: ${S3_REGION:-garage}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_BUCKET: ${S3_BUCKET:-votebox-assets}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run node scripts/setup-local-env.mjs}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Run node scripts/setup-local-env.mjs}
  MEDIA_WORKER_KEY: ${MEDIA_WORKER_KEY:?Run node scripts/setup-local-env.mjs}

services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    command: [postgres, -c, timezone=UTC]
    environment:
      POSTGRES_USER: vote_machine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vote_machine_local}
      POSTGRES_DB: vote_machine
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vote_machine -d vote_machine']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    profiles: [local-storage]
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Run node scripts/setup-local-env.mjs}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Run node scripts/setup-local-env.mjs}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Run node scripts/setup-local-env.mjs}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-votebox-assets}
      NO_COLOR: '1'
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    healthcheck:
      test: [CMD, /garage, status]
      interval: 3s
      timeout: 5s
      retries: 30
    init: true

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgresql://vote_machine:${POSTGRES_PASSWORD:-vote_machine_local}@postgres:5432/vote_machine
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_COMMIT: ${DEPLOY_REVISION:-dev}
    environment:
      DATABASE_URL: postgresql://vote_machine:${POSTGRES_PASSWORD:-vote_machine_local}@postgres:5432/vote_machine
      API_PORT: '8080'
      API_GATEWAY_KEY: ${API_GATEWAY_KEY:?Run node scripts/setup-local-env.mjs}
      RATE_NETWORK_PER_MINUTE: ${RATE_NETWORK_PER_MINUTE:-60000}
      RATE_CREATE_PER_HOUR: ${RATE_CREATE_PER_HOUR:-1000}
      RATE_READ_PER_MINUTE: ${RATE_READ_PER_MINUTE:-1200}
      RATE_WRITE_PER_MINUTE: ${RATE_WRITE_PER_MINUTE:-240}
      RATE_ROOM_PER_MINUTE: ${RATE_ROOM_PER_MINUTE:-30000}
      MEDIA_WORKER_KEY: ${MEDIA_WORKER_KEY:?Run node scripts/setup-local-env.mjs}
      ADMIN_LINK_KEY: ${ADMIN_LINK_KEY:?Set ADMIN_LINK_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --max-time,
          '4',
          'http://localhost:8080/health/ready',
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    init: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      <<: *storage-environment
      API_ORIGIN: http://api:8080
      API_GATEWAY_KEY: ${API_GATEWAY_KEY:?Run node scripts/setup-local-env.mjs}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
      garage:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    init: true

  asset-cleanup:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: [node, apps/web/scripts/clean-assets.mjs]
    environment:
      <<: *storage-environment
      API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
      garage:
        condition: service_healthy
        required: false
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
  garage_data:
